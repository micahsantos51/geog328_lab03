<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <title>Vietnam Tourism</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <!-- Including the Mapbox GL CSS file -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">

    <!-- Including the Mapbox GL JS file -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>

    <style>
        /* CSS styles for the layout and components */
        body {
            margin: 0;
            padding: 0;
        }

        #container {
            display: flex;
            height: 100vh;
            flex-direction: row;
            align-items: stretch;
            padding: 20px;
            box-sizing: border-box;
        }

        #side-panel {
            flex-basis: 500px;
            overflow-y: scroll;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        h2+button {
            margin-top: 18px;
        }

        button+table {
            margin-top: 4px;
        }

        #map {
            flex-grow: 1;
        }

        button {
            margin-bottom: 10px;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            border: 1px solid #ddd;
        }



        th,
        td {
            text-align: left;
            padding: 16px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        @media screen and (max-width: 1024px) {
            #side-panel {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main id="container">
        <div id="side-panel">

            <h2>Tourism in Vietnam by City</h2>

            <button>Sort by number of visitors</button>
            <table>
                <tr>
                    <th>City</th>
                    <th>Visitors (total)</th>
                    <th>Coordinates</th>
                </tr>
            </table>
        </div>
        <div id="map"></div>

    </main>
    <script>
        // Define the Mapbox access token
        mapboxgl.accessToken =
            'pk.eyJ1Ijoiemhhb2JvIiwiYSI6ImNqaW85NzNrdDA3OXczcHQ5aTZvYmtjc2gifQ.ummEQxsRIweCIdv9CRRzOw';

        // Create the map object
        let map = new mapboxgl.Map({
            container: 'map', // container ID
            style: 'mapbox://styles/mapbox/navigation-day-v1', // style URL
            zoom: 4.5, // starting zoom
            center: [108.22579521684344,
                14.267830796886756] // starting center
        });


        async function geojsonFetch() {

            let response, tourism, vietnam, table;
            response = await fetch('assets/vietnam_major_cities_tourism_2024.geojson');
            tourism = await response.json();
            response = await fetch('assets/vietnam.json');
            vietnam = await response.json();
            table = document.getElementsByTagName("table")[0];

            let row, cell1, cell2, cell3;

            for (let i = 0; i < tourism.features.length; i++) {
                // Create an empty <tr> element and add it to the 1st position of the table:
                row = table.insertRow(-1);
                cell1 = row.insertCell(0);
                cell2 = row.insertCell(1);
                cell3 = row.insertCell(2);

                let coordString = tourism.features[i].geometry.coordinates;
                let lon = coordString[0];
                let lat = coordString[1];
                let coordinates = `${lon}, ${lat}`;

                cell2.innerHTML = tourism.features[i].properties.visitors_2024_total;
                cell1.innerHTML = tourism.features[i].properties.name;
                cell3.innerHTML = coordinates;
            }

            //load data to the map as new layers and table on the side.
            map.on('load', function loadingData() {

                map.addSource('tourism', {
                    type: 'geojson',
                    data: tourism
                });

                map.addLayer({
                    'id': 'tourism-layer',
                    'type': 'circle',
                    'source': 'tourism',
                    'paint': {
                        'circle-radius': 4,
                        'circle-stroke-width': 3,
                        'circle-color': 'darkorange',
                        'circle-stroke-color': 'black'
                    }
                });


                map.addSource('vietnam', {
                    type: 'geojson',
                    data: vietnam
                });

                map.addLayer({
                    'id': 'vietnam-layer',
                    'type': 'fill',
                    'source': 'vietnam',
                    'paint': {
                        'fill-color': '#0080ff', // blue color fill
                        'fill-opacity': 0.5
                    }
                });

            });

        }

        geojsonFetch();

        let btn = document.getElementsByTagName("button")[0];

        btn.addEventListener('click', sortTable);

        // define the function to sort table
        function sortTable(e) {
            let table, rows, switching, i, x, y, shouldSwitch;
            table = document.getElementsByTagName("table")[0];
            switching = true;
            /*Make a loop that will continue until
            no switching has been done:*/
            while (switching) {
                //start by saying: no switching is done:
                switching = false;
                rows = table.rows;
                /*Loop through all table rows (except the
                first, which contains table headers):*/
                for (i = 1; i < (rows.length - 1); i++) {
                    //start by saying there should be no switching:
                    shouldSwitch = false;
                    /*Get the two elements you want to compare,
                    one from current row and one from the next:*/
                    x = parseFloat(rows[i].getElementsByTagName("td")[1].innerHTML);
                    y = parseFloat(rows[i + 1].getElementsByTagName("td")[1].innerHTML);
                    //check if the two rows should switch place:
                    if (x < y) {
                        //if so, mark as a switch and break the loop:
                        shouldSwitch = true;
                        break;
                    }
                }
                if (shouldSwitch) {
                    /*If a switch has been marked, make the switch
                    and mark that a switch has been done:*/
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                }
            }
        }
    </script>

</body>

</html>
